# 외부 테스트용 데이터셋: SIDS (kjy)
# https://universe.roboflow.com/kjy-5agtz/sids-vrari (CC BY 4.0, v2 1,459장)
# Baby-Position과 다른 인형·천·배경이라 "처음 보는 인형"에서의 성능을 재는 데 써요.
#
# 라벨 방식이 달라요: kjy는 인형 전체에 박스 하나를 그리고 정상/얼굴 가림/뒤집힘을 붙였어요.
# 그래서 박스 지표(mAP)는 의미가 없고, 사진 단위 위험 판정만 비교해요 (evaluate.py --no-box).
roboflow:
  workspace: kjy-5agtz
  project: sids-vrari
  version: 2
  format: yolov8

raw_dir: datasets/raw/kjy-sids-v2
out_dir: datasets/kjy

classes: [supine, side, prone, airway_visible, airway_covered]

class_map:
  normal: supine                 # 정상 → 위험 없음
  overturn: prone                # 뒤집힘 → 엎드림 위험
  covered_face: airway_covered   # 천으로 덮임 → 얼굴 가림 위험 (몸 박스 없이 가림 박스만 있는 것으로 처리)

source_groups: []
default_group: kjy
holdout_groups: []
val_fraction: 0.15
seed: 0
